<title>AMC 班級加減點</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Layout: school-stationery scoreboard — blue grid-paper ground, white "index card" student tiles held by a strip of washi tape, highlighter-marker accents on numbers. Single light look by choice. */
:root{
  --paper:#f4f8fd; --grid:#e2ebf6; --card:#ffffff; --ink:#15233f; --muted:#5d6c87; --line:#d8e3f1; --sunk:#eef3fa;
  --blue:#2f6fed; --blue-s:#e3ecfd; --plus:#0f9d58; --plus-s:#dcf5e6; --minus:#e0444f; --minus-s:#fde3e5;
  --hl:#ffe45c; --hl-g:#b7f0cf; --hl-p:#ffc6d3; --hl-b:#bfdcff; --hl-o:#ffd6a8; --hl-v:#dccbff;
  --f-head:"LXGW WenKai TC","Noto Sans TC","PingFang TC",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Outfit","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}

/* header */
.hd{background:var(--card);border-bottom:2px solid var(--ink)}
.hd .wrap{padding-block:18px 14px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.brand{display:flex;align-items:center;gap:14px}
.stamp{width:54px;height:54px;border:2.5px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:22px;background:var(--hl);transform:rotate(-4deg);box-shadow:3px 3px 0 var(--ink);flex:none}
.eyebrow{font-family:var(--f-num);font-weight:700;letter-spacing:.18em;font-size:12px;color:var(--blue)}
.ttl{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1}
.ttl mark{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 2px}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--card)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--plus)}
.bar2{background:var(--card);border-bottom:1px solid var(--line)}
.bar2 .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.cchip{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:5px 14px;font-weight:700;font-size:15px;font-family:var(--f-num);transition:transform .12s}
.cchip:hover{transform:translateY(-1px)}
.cchip.on{background:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--hl)}
.cchip .ct{font-family:var(--f-ui);font-size:11px;font-weight:500;margin-left:6px;opacity:.75}
.cchip.add{border-style:dashed;color:var(--muted)}
.tools .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:16px 4px}
.nb{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.nb:hover{border-color:var(--ink)}
.nb.on{background:var(--hl);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.nb .k{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--sunk)}
.nb.proj{margin-left:auto;background:var(--ink);border-color:var(--ink);color:#fff}
.nb.proj .k{background:rgba(255,255,255,.18)}
.sorts{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.sorts button{border:0;background:none;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.sorts button.on{background:var(--blue-s);color:var(--blue)}
main{padding-block:10px 130px}

/* class summary strip */
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}
.sum .s{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;min-width:120px}
.sum .s span{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.sum .s b{font-family:var(--f-num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.sum .s.p b{color:var(--plus)}.sum .s.n b{color:var(--minus)}

/* student cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.card{--tape:var(--hl);position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:6px 6px 14px 14px;padding:20px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 1px 0 var(--line),0 10px 20px -16px rgba(21,35,63,.45);transition:transform .15s,box-shadow .15s}
.card::before{content:"";position:absolute;top:-9px;left:50%;width:74px;height:20px;margin-left:-37px;background:var(--tape);opacity:.85;transform:rotate(-2deg);border-left:2px dotted rgba(255,255,255,.6);border-right:2px dotted rgba(255,255,255,.6)}
.card:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 1px 0 var(--line),0 16px 26px -16px rgba(21,35,63,.5)}
.card.sel{border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.card .tick{position:absolute;top:10px;left:10px;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);background:#fff;display:none;place-items:center;color:#fff;font-weight:900;font-size:13px}
.batch .card .tick{display:grid}
.card.sel .tick{background:var(--ink);border-color:var(--ink)}
.seat{position:absolute;top:10px;right:12px;font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:600}
.nm{font-family:var(--f-head);font-weight:700;font-size:22px;line-height:1.15;word-break:break-all}
.nk{font-size:12px;color:var(--muted)}
.pts{font-family:var(--f-num);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px}
.pts small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.pts.neg{color:var(--minus)}
.wk{display:flex;gap:6px;flex-wrap:wrap}
.wk span{font-family:var(--f-num);font-weight:700;font-size:13px;border-radius:6px;padding:0 7px}
.wk .p{background:var(--plus-s);color:var(--plus)}.wk .n{background:var(--minus-s);color:var(--minus)}.wk .z{background:var(--sunk);color:var(--muted)}
.coin{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;background:#fff6cf;border:1.5px solid #f2d36b;border-radius:999px;padding:1px 10px 1px 5px;font-size:12.5px;font-weight:700;color:#8a5a00}
.coin b{font-family:var(--f-num);font-size:15px}
.jt{border-collapse:collapse;font-size:13px;width:100%}
.jt th,.jt td{border-bottom:1px dashed var(--line);padding:6px 4px;text-align:center;white-space:nowrap}
.jt th{font-size:11.5px;color:var(--muted)}
.jt td:first-child,.jt th:first-child{text-align:left}
.jc{display:inline-block;min-width:30px;border-radius:6px;padding:1px 4px;font-family:var(--f-num);font-weight:700}
.jc.full{background:var(--plus-s);color:var(--plus)}.jc.part{background:#fff6cf;color:#8a5a00}.jc.none{color:var(--line)}
.marks{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.marks i{white-space:nowrap}
.marks i{font-style:normal;font-size:10.5px;font-weight:800;border-radius:4px;padding:0 4px;background:var(--sunk);color:var(--muted)}
.marks i.f{background:var(--plus-s);color:var(--plus)}.marks i.r{background:#fff6cf;color:#8a5a00}
.pick{flex-wrap:wrap}
.pick .marks{flex-basis:100%;padding-left:30px;min-width:0}
.cust{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-top:10px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.cust label.f{flex:1 1 140px}
.jlbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ib.coinb{background:#fff6cf}.ib.coinb b{color:#b77900}
.ib.coinr{background:var(--sunk)}.ib.coinr b{color:#b77900}
.recent{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.recent i{font-style:normal;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 6px;line-height:20px;white-space:nowrap}
.recent .p{background:var(--plus-s);color:var(--plus)}.recent .n{background:var(--minus-s);color:var(--minus)}.recent .z{background:var(--sunk);color:var(--muted)}
.rank{position:absolute;top:-14px;right:10px;font-family:var(--f-num);font-weight:800;font-size:13px;background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px}
.flash-p{animation:fp .7s ease-out}.flash-n{animation:fn .7s ease-out}
@keyframes fp{0%{box-shadow:0 0 0 6px var(--hl-g)}100%{box-shadow:0 1px 0 var(--line),0 10px 20px -16px rgba(21,35,63,.45)}}
@keyframes fn{0%{box-shadow:0 0 0 6px var(--hl-p)}100%{box-shadow:0 1px 0 var(--line),0 10px 20px -16px rgba(21,35,63,.45)}}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(21,35,63,.42);display:grid;place-items:center;padding:14px}
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:18px;width:min(760px,100%);max-height:calc(100% - 16px);overflow:auto;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.sheet.wide{width:min(1100px,100%)}
.sheet h2{margin:0;font-family:var(--f-head);font-size:26px;font-weight:700}
.sheet h3{margin:18px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.12em;font-weight:700}
.sheet p{margin:4px 0;color:var(--muted)}
.shtop{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:5px 14px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bigpts{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:8px}
.bigpts b{font-family:var(--f-num);font-size:64px;font-weight:800;line-height:1;background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 92%,transparent 92%)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ib{border-radius:14px;padding:14px 16px;text-align:left;font-weight:900;font-size:18px;display:flex;gap:12px;align-items:center;border:2px solid transparent;min-height:66px;transition:transform .1s}
.ib b{font-family:var(--f-num);font-size:28px;font-weight:800;min-width:46px}
.ib.plus{background:var(--plus-s);color:var(--ink)}.ib.plus b{color:var(--plus)}
.ib.minus{background:var(--minus-s);color:var(--ink)}.ib.minus b{color:var(--minus)}
.ib.zero{background:var(--sunk)}.ib.zero b{color:var(--muted);font-size:18px}
.ib:hover{border-color:var(--ink)}
.ib:active{transform:scale(.97)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;transition:transform .1s}
.pick:hover{border-color:var(--ink)}
.pick .pn{font-family:var(--f-num);font-size:12px;color:var(--muted);width:22px}
.pick .pm{flex:1;min-width:0;font-family:var(--f-head);font-size:18px;word-break:break-all}
.pick .pp{font-family:var(--f-num);font-weight:800;color:var(--muted)}
.pick.on{background:var(--hl);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.pick.on .pn{color:var(--ink)}
.pick:active{transform:scale(.97)}
.batchbar .ib{min-height:0;padding:7px 12px;font-size:14px}.batchbar .ib b{font-size:18px;min-width:30px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-size:14px;font-weight:700}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.warn{color:var(--minus);border-color:#f3c3c7}
.btn.armed{background:var(--minus);color:#fff;border-color:var(--minus)}
.btn.sm{padding:4px 10px;font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--sunk);border:1.5px solid transparent;border-radius:10px;padding:8px 11px;width:100%;min-width:0;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff;outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.note{font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--plus-s);color:var(--plus)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.08em}
.tbl td.num{font-family:var(--f-num);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.tbl td.pos{color:var(--plus)}.tbl td.neg{color:var(--minus)}
.tbl input,.tbl select{padding:5px 8px}
.scroll{overflow-x:auto}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.log .t{font-family:var(--f-num);color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-width:86px}
.log .d{font-family:var(--f-num);font-weight:800;min-width:34px}
.log .d.p{color:var(--plus)}.log .d.n{color:var(--minus)}
.log .x{margin-left:auto}
.log li.void{opacity:.5}.log li.void .what{text-decoration:line-through}
.log .what{flex:1 1 200px;min-width:0}
.log .by{font-size:12px;color:var(--muted)}
.tchk{display:flex;flex-wrap:wrap;gap:6px}
.tchk label{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;cursor:pointer}
.ovk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.ovk .k{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.ovk .k span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.ovk .k b{display:block;font-family:var(--f-num);font-size:30px;font-weight:800;line-height:1.1}
.ovk .k.p b{color:var(--plus)}.ovk .k.n b{color:var(--minus)}
.ibar{display:inline-block;height:10px;border-radius:3px;vertical-align:middle;margin-right:6px}

/* batch bar */
.batchbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.batchbar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px}
.batchbar .cnt{font-weight:900;margin-right:6px;background:var(--hl);padding:2px 8px;border-radius:6px}

/* projection */
.projexit{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:9;display:none}
body.proj .projexit{display:inline-flex}
body.proj .tools,body.proj .who,body.proj .adminonly,body.proj .recent,body.proj .wk .n{display:none!important}
body.proj .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
body.proj .nm{font-size:28px}
body.proj .pts{font-size:64px}

#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;box-shadow:3px 3px 0 var(--hl);animation:tin .25s ease-out;max-width:min(420px,90vw)}
.toast.neg{background:var(--minus);box-shadow:3px 3px 0 var(--hl-p)}
.batching #toasts{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.empty{max-width:560px;margin:30px auto;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center;color:var(--muted);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:30px 20px}
.empty h2{margin:0;font-family:var(--f-head);font-size:26px;color:var(--ink)}
@media (max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.pts{font-size:38px}.nm{font-size:19px}.sheet{padding:14px}.nb.proj{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="hd"><div class="wrap">
  <div class="brand"><div class="stamp" aria-hidden="true">+3</div>
    <div><div class="eyebrow">AMC · CLASS POINTS</div><h1 class="ttl"><mark>班級加減點</mark></h1></div></div>
  <div class="who"><span class="pill"><span class="dot" id="stDot"></span><span id="stTxt">連線中…</span></span><span id="meTxt" hidden></span><button class="btn sm" id="bLogout" hidden>登出</button></div>
</div></header>
<div class="bar2"><div class="wrap" id="classBar"></div></div>
<div class="tools"><div class="wrap">
  <button class="nb" id="bBatch"><span class="k">✓</span>批次加減點</button>
  <button class="nb" id="bJl"><span class="k">傑</span>發送傑立幣</button>
  <button class="nb" id="bLog"><span class="k">≡</span>異動紀錄</button>
  <button class="nb" id="bManage"><span class="k">☰</span>班級與學生</button>
  <button class="nb" id="bOv"><span class="k">▤</span>全校總覽</button>
  <button class="nb" id="bSet"><span class="k">⚙</span>規則設定</button>
  <span class="sorts" role="group" aria-label="排序"><button data-sort="seat">座號</button><button data-sort="pts">總點數高→低</button><button data-sort="week">本週</button></span>
  <button class="nb proj" id="bProj"><span class="k">▣</span>投影模式</button>
</div></div>
<button class="btn pri projexit" id="bProjExit">離開投影</button>
<main class="wrap"><div id="sum" class="sum"></div><div id="grid" class="grid"></div></main>

<div id="login" class="modal" hidden><div class="sheet" style="max-width:440px;text-align:center"><div class="stamp" style="margin:0 auto 10px">+3</div><h2>班級加減點</h2><p style="margin:8px 0 16px">請用老師的 Google 帳號登入</p><div id="inApp"></div><button class="btn pri" id="gLogin" style="font-size:16px;padding:10px 22px">用 Google 登入</button><p class="note" id="loginErr" style="margin-top:10px"></p></div></div>

<script>
const DEF_ITEMS=[
  {id:'hw',n:'準時交作業',p:2},{id:'exam',n:'考試 100 分',p:3},{id:'exam95',n:'考試 95 分',p:2},{id:'exam90',n:'考試 90 分',p:1},{id:'late0',n:'當天補交',p:1,kind:'hw_late'},{id:'late1',n:'隔天補交',p:1,kind:'hw_late'},
  {id:'miss',n:'沒有交功課',p:-3,kind:'hw_miss'},{id:'bag',n:'沒有帶美語袋',p:-5},{id:'fail',n:'考試未通過',p:0}
];
const TAPES=['var(--hl)','var(--hl-g)','var(--hl-p)','var(--hl-b)','var(--hl-o)','var(--hl-v)'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sg=n=>(n>0?'+':n<0?'−':'±')+Math.abs(n);
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtT=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function hashStr(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function lsGet(k){try{return localStorage.getItem('amcPts.'+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('amcPts.'+k,v)}catch(e){}}

let CFG={items:clone(DEF_ITEMS)};
let CLASSES={},STUDENTS={};
let CUR=lsGet('class')||null;
let DB=null,USER=null,ME='me',CAN=true,LOCAL=false,READY=false,IS_OWNER=true,TEACHERS={};
let VIEW_ALL=lsGet('viewAll')!=='0';
let SORT=lsGet('sort')||'seat';
let SPOV={};const RCACHE=new Map();const LOCAL_HATCH={};function refreshSpecies(){}
const UI={batch:false,sel:new Set(),proj:false,flash:{}};
const LOCAL_EV={},PENDING={},INFLIGHT={},NEWSTU=new Set();
const PROFILES={};
function mergeCfg(d){const c={items:clone(DEF_ITEMS)};if(d&&Array.isArray(d.items)&&d.items.length)c.items=d.items;return c}

/* points derived from the event log (voided events never count) */
const live=s=>(s.events||[]).filter(e=>!e.v&&(e.k==='item'||e.k==='adj'));
const initPts=s=>(s.events||[]).filter(e=>!e.v&&e.k==='init').reduce((a,e)=>a+(e.d||0),0);
const initJl=s=>(s.events||[]).filter(e=>!e.v&&e.k==='jlinit').reduce((a,e)=>a+(e.d||0),0);
/* 傑立幣：每課 單字3＋單元考3＋Sensay3，三項都一次通過再 +1＝10；補考通過 +1；期中／期末 筆試5＋口說5；一冊最多 100 */
const JL_COMP={vocab:['單字',3],unit:['單元考',3],sensay:['Sensay',3],w:['筆試',5],o:['口說',5]};
const JL_LES=[['1','第 1 課'],['2','第 2 課'],['3','第 3 課'],['4','第 4 課'],['5','第 5 課'],['6','第 6 課'],['7','第 7 課'],['8','第 8 課'],['mid','期中考'],['fin','期末考']];
const lesName=l=>(JL_LES.find(x=>x[0]===l)||[l,l])[1];
const compsOf=l=>/^\d+$/.test(l)?['vocab','unit','sensay']:['w','o'];
const JL_CAP=100;
function jlLedger(s){
  const books={};let adj=initJl(s);
  const evs=(s.events||[]).filter(e=>!e.v&&(e.k==='jl'||e.k==='jladj')).sort((a,b)=>a.t-b.t);
  for(const e of evs){
    if(e.k==='jladj'){adj+=e.d||0;continue}
    const b=books[e.book]||(books[e.book]={les:{},total:0,raw:0});
    const L=b.les[e.les]||(b.les[e.les]={});
    if(L[e.comp])continue;
    L[e.comp]={kind:e.kind,d:e.d,t:e.t,id:e.id};
  }
  let earned=0;
  for(const name in books){
    const b=books[name];let raw=0;
    for(const l in b.les){const L=b.les[l];let sum=0;for(const c in L)sum+=L[c].d||0;
      L._bonus=compsOf(l).length===3&&compsOf(l).every(c=>L[c]&&L[c].kind==='first')?1:0;sum+=L._bonus;L._sum=sum;raw+=sum}
    b.raw=raw;b.total=Math.min(JL_CAP,raw);earned+=b.total;
  }
  return{books,earned,adj,bal:earned+adj};
}
const COIN=`<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" style="vertical-align:-3px"><circle cx="10" cy="10" r="9" fill="#ffd34d" stroke="#c98a00" stroke-width="1.6"/><circle cx="10" cy="10" r="6" fill="none" stroke="#c98a00" stroke-width="1.2"/><text x="10" y="13.4" text-anchor="middle" font-size="8.5" font-weight="900" fill="#8a5a00" font-family="sans-serif">傑</text></svg>`;
function weekStart(){const n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();return d0-((n.getDay()+6)%7)*86400000}
function stats(s,from){
  let tot=0,wp=0,wn=0;const ws=from==null?weekStart():from;
  tot=initPts(s);
  for(const e of live(s)){const d=e.d||0;tot+=d;if(e.t>=ws){if(d>0)wp+=d;if(d<0)wn+=d}}
  return{tot,wp,wn};
}

function showFbErr(e){
  const code=(e&&e.code)||'unknown',msg=(e&&e.message)||'';
  setStatus('err');$('#stTxt').textContent='連線失敗：'+code;
  const g=$('#grid');if(!g)return;g.className='';
  const who=FBU&&FBU.email?FBU.email:'';
  g.innerHTML=window.FBERR_HTML=`<div class="empty" style="text-align:left;align-items:stretch"><h2>讀不到資料</h2>`+(code==='permission-denied'?`<p>目前登入的帳號 <b>${esc(who)}</b> 沒有讀取權限。請到 Firebase → Firestore Database → 規則，確認這個 Gmail 在名單裡，並且有按「發布」。</p>`:`<p>錯誤代碼：<b>${esc(code)}</b></p>`)+`<p class="note" style="word-break:break-all">${esc(msg)}</p><button class="btn pri" onclick="location.reload()">重新整理</button></div>`;
}
function setStatus(k){const m={wait:['#f5a800','連線中…'],ok:['#0f9a6e','雲端資料庫已連線'],local:['#f97316','預覽模式（只存在這台電腦）'],err:['#e2334f','連線中斷，請重新整理'],ro:['#3b82f6','只能查看']}[k];$('#stDot').style.background=m[0];$('#stTxt').textContent=m[1]}
function localSave(){try{localStorage.setItem('amcPts.data',JSON.stringify({classes:CLASSES,students:STUDENTS,cfg:CFG}))}catch(e){}}
function cleanStu(s){const o=clone(s);delete o.id;return o}
function queueWrite(sid){
  if(LOCAL){localSave();return}
  if(!DB)return;
  clearTimeout(PENDING[sid]);
  PENDING[sid]=setTimeout(()=>flushStu(sid),260);
}
function flushStu(sid){
  delete PENDING[sid];
  const run=async()=>{const s=STUDENTS[sid];if(!s)return;try{await DB.doc('ac_students/'+sid).set(cleanStu(s))}catch(e){writeErr(e)}};
  INFLIGHT[sid]=(INFLIGHT[sid]||Promise.resolve()).then(run);
}
let errAt=0;
function writeErr(e){if(Date.now()-errAt<4000)return;errAt=Date.now();const c=e&&e.code;toast(c==='invalid_argument'||c==='permission-denied'?'你的帳號只能查看，不能修改':c==='quota_exceeded'?'資料庫空間已滿，請匯出備份後清理舊資料':'沒有存到雲端，請檢查網路',1)}
async function saveDoc(path,data){
  if(LOCAL){localSave();return}
  try{await DB.doc(path).set(clone(data))}catch(e){writeErr(e)}
}
function applyStudents(snap){
  const seen=new Set();
  snap.docs.forEach(d=>{
    if(!d.exists)return;
    const data=clone(d.data());data.id=d.id;seen.add(d.id);NEWSTU.delete(d.id);
    let need=false;
    const lx=LOCAL_EV[d.id];
    if(lx&&lx.size){
      const map=new Map((data.events||[]).map(e=>[e.id,e]));
      for(const [id,ev] of lx){const r=map.get(id);if(!r||(ev.v&&!r.v)){map.set(id,ev);need=true}else lx.delete(id)}
      data.events=[...map.values()];
    }
    const lh=LOCAL_HATCH[d.id];
    if(lh){data.hatch=data.hatch||{};for(const n in lh){if(data.hatch[n]==null){data.hatch[n]=lh[n];need=true}else delete lh[n]}}
    if(PENDING[d.id]&&STUDENTS[d.id]){const loc=STUDENTS[d.id];for(const k of ['name','nick','active','classId','say'])data[k]=loc[k]}
    STUDENTS[d.id]=data;
    if(need)queueWrite(d.id);
  });
  for(const id of Object.keys(STUDENTS)){if(!seen.has(id)&&!NEWSTU.has(id)&&!PENDING[id])delete STUDENTS[id]}
  render();
}
let unsubStu=null;
function subscribeClass(){
  if(LOCAL||!DB)return;
  if(unsubStu){try{unsubStu()}catch(e){}unsubStu=null}
  STUDENTS={};
  if(!CUR){render();return}
  unsubStu=DB.collection('ac_students').where('classId','==',CUR).onSnapshot(applyStudents,e=>showFbErr(e));
}
const FBC=window.FIREBASE_CONFIG||{};
const FB=!!(FBC.apiKey&&FBC.projectId&&window.firebase);
let FBU=null,FBUSER=null;
const UA=navigator.userAgent||'',IN_LINE=/ Line\//i.test(UA),IN_APP=IN_LINE||/FBAN|FBAV|Instagram|MicroMessenger|KAKAOTALK/i.test(UA);
if(IN_LINE&&!/openExternalBrowser=1/.test(location.search))location.replace(location.pathname+(location.search?location.search+'&':'?')+'openExternalBrowser=1'+location.hash);
function fbStart(){
  return new Promise(res=>{
    firebase.initializeApp(FBC);
    const fs=firebase.firestore(),auth=firebase.auth();
    $('#gLogin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')$('#loginErr').textContent='登入失敗：'+(e.message||e.code)});
    $('#bLogout').onclick=()=>auth.signOut().then(()=>location.reload());
    if(IN_APP)$('#inApp').innerHTML='<div class="cust" style="text-align:left;margin-bottom:12px"><b>請改用 Safari 或 Chrome 開啟。</b>App 內建的瀏覽器不能登入 Google。</div>';
    let done=false;
    auth.onAuthStateChanged(u=>{
      if(!u){$('#login').hidden=false;setStatus('wait');return}
      $('#login').hidden=true;FBU=u;
      FBUSER={id:async()=>u.uid,isOwner:async()=>{try{const r=fs.doc('ac_config/admin');const d=await r.get();if(!d.exists){await r.set({uid:u.uid,t:Date.now()});return true}return d.data().uid===u.uid}catch(e){return false}},canEdit:async()=>true,me:async()=>({name:u.displayName||u.email}),
        profiles:async ids=>{const o={};ids.forEach(id=>{const t=TEACHERS[id];if(t)o[id]={name:t.name||t.email||''}});return o}};
      $('#bLogout').hidden=false;
      if(!done){done=true;res(fs)}
    });
  });
}
async function init(){
  let db=null;
  if(FB)db=await fbStart();
  else try{db=await window.claude?.use?.('db')}catch(e){}
  if(!db){
    LOCAL=true;
    try{const d=JSON.parse(localStorage.getItem('amcPts.data'));if(d){CLASSES=d.classes||{};STUDENTS=d.students||{};CFG=mergeCfg(d.cfg)}}catch(e){}
    refreshSpecies();READY=true;setStatus('local');pickClass();render();return;
  }
  DB=db;
  try{USER=FB?FBUSER:await window.claude.use('user');if(USER){ME=(await USER.id())||'me';IS_OWNER=!!(await USER.isOwner());const ce=await USER.canEdit();CAN=!!ce||IS_OWNER;const p=await USER.me();if(p&&p.name){PROFILES[ME]=p.name;$('#meTxt').textContent=(IS_OWNER?'管理者 · ':'老師 · ')+p.name;$('#meTxt').hidden=false}}}catch(e){IS_OWNER=false}
  setStatus(CAN?'ok':'ro');
  if(CAN&&ME!=='me')DB.doc('ac_teachers/'+ME).set({seen:Date.now(),owner:IS_OWNER?1:0,...(FB&&FBU?{name:FBU.displayName||'',email:FBU.email||''}:{})}).catch(()=>{});
  DB.collection('ac_teachers').onSnapshot(s=>{TEACHERS={};s.docs.forEach(d=>{if(d.exists){TEACHERS[d.id]=clone(d.data());if(FB&&TEACHERS[d.id].name)PROFILES[d.id]=TEACHERS[d.id].name}});loadNames(Object.keys(TEACHERS))},()=>{});
  DB.doc('ac_config/points').onSnapshot(d=>{CFG=mergeCfg(d.exists?clone(d.data()):null);render()},()=>{});
  DB.collection('ac_classes').onSnapshot(s=>{
    const m={};s.docs.forEach(d=>{if(d.exists){m[d.id]={...clone(d.data()),id:d.id}}});
    for(const id in CLASSES)if(CLASSES[id]._new&&!m[id])m[id]=CLASSES[id];
    CLASSES=m;READY=true;const before=CUR;pickClass();if(before!==CUR||!unsubStu)subscribeClass();render();
  },e=>showFbErr(e));
}
function canSee(c){if(LOCAL||(IS_OWNER&&VIEW_ALL))return true;return (c.teachers||[]).includes(ME)||c.by===ME}
function teacherNames(c){const t=c.teachers||[];return t.length?t.map(id=>PROFILES[id]||'老師').join('、'):'未指定'}
async function loadNames(ids){ids=ids.filter(id=>id&&id!=='me'&&!PROFILES[id]);if(!USER||!ids.length){render();return}try{const ps=await USER.profiles(ids);for(const id of ids){const n=ps&&ps[id]&&ps[id].name;if(n)PROFILES[id]=n}}catch(e){}render()}
function activeClasses(){return Object.values(CLASSES).filter(c=>c.active!==false&&canSee(c)).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0))}
function pickClass(){const a=activeClasses();if(!CUR||!CLASSES[CUR]||CLASSES[CUR].active===false)CUR=a[0]?a[0].id:null;lsSet('class',CUR||'')}
function classStudents(cid){return Object.values(STUDENTS).filter(s=>s.classId===(cid||CUR)&&s.active!==false).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0))}

/* ================= actions ================= */
function addEvent(s,ev){
  ev.id=uid();ev.t=Date.now();ev.by=ME;
  s.events=s.events||[];s.events.push(ev);
  (LOCAL_EV[s.id]||(LOCAL_EV[s.id]=new Map())).set(ev.id,ev);
  queueWrite(s.id);
  return ev;
}
function setInit(s,k,v){
  const cur=(s.events||[]).filter(e=>!e.v&&e.k===k);
  const now=cur.reduce((a,e)=>a+(e.d||0),0);if(now===v)return;
  cur.forEach(e=>{e.v={t:Date.now(),by:ME,r:'修改原有數量'};(LOCAL_EV[s.id]||(LOCAL_EV[s.id]=new Map())).set(e.id,e)});
  if(v)addEvent(s,{k,d:v,r:k==='init'?'原有點數':'原有傑立幣'});
}
function guard(){if(!CAN){toast('你的帳號只能查看',1);return false}return true}
function openMiss(s){
  const evs=(s.events||[]).filter(e=>!e.v);
  const linked=new Set(evs.filter(e=>e.lk).map(e=>e.lk));
  const miss=evs.filter(e=>e.k==='item'&&(CFG.items.find(i=>i.id===e.i)||{}).kind==='hw_miss'&&!linked.has(e.id)).sort((a,b)=>b.t-a.t);
  return miss[0]||null;
}
function applyItem(sids,item){
  if(!guard())return;
  const names=[];
  sids.forEach(sid=>{
    const s=STUDENTS[sid];if(!s)return;
    const ev={k:'item',i:item.id,n:item.n,d:item.p};
    if(item.p<0||item.kind==='hw_miss'||item.id==='fail')ev.neg=1;
    if(item.kind==='hw_late'){const m=openMiss(s);if(m)ev.lk=m.id}
    addEvent(s,ev);names.push(s.nick||s.name);UI.flash[sid]=item.p>0?'p':item.p<0?'n':'';
  });
  if(names.length){toast(`${item.p?sg(item.p)+' ':''}${names.length>3?names.slice(0,3).join('、')+` 等 ${names.length} 人`:names.join('、')} · ${item.n}`,item.p<0);tone(item.p>0?[660,880]:item.p<0?[300,220]:[520])}
  render();
}
function adjust(s,d,reason,note){
  if(!guard())return;
  addEvent(s,{k:'adj',d,r:reason,nt:note||'',neg:d<0?1:0});UI.flash[s.id]=d>0?'p':'n';render();
}
function voidEvent(s,eid,reason){
  if(!guard())return;
  const e=(s.events||[]).find(x=>x.id===eid);if(!e||e.v)return;
  e.v={t:Date.now(),by:ME,r:reason||'更正'};
  (LOCAL_EV[s.id]||(LOCAL_EV[s.id]=new Map())).set(e.id,e);
  queueWrite(s.id);render();toast('已更正，點數已重新計算');
}

/* ================= render ================= */
function sortedStudents(){
  const list=classStudents();
  if(SORT==='pts')return list.map(s=>[s,stats(s).tot]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  if(SORT==='week')return list.map(s=>{const t=stats(s);return[s,t.wp+t.wn]}).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  return list;
}
function render(){
  $('#bOv').hidden=!(LOCAL||IS_OWNER);$('#bSet').hidden=!(LOCAL||IS_OWNER);
  renderClassBar();
  document.querySelectorAll('[data-sort]').forEach(b=>b.classList.toggle('on',b.dataset.sort===SORT));
  $('#bBatch').classList.toggle('on',UI.batch);
  document.body.classList.toggle('batching',UI.batch);
  document.body.classList.toggle('proj',UI.proj);
  const grid=$('#grid'),sum=$('#sum');
  if(window.FBERR_HTML){sum.innerHTML='';grid.className='';grid.innerHTML=window.FBERR_HTML;return}
  if(!READY){sum.innerHTML='';grid.className='';grid.innerHTML=`<div class="empty"><p>載入資料中…</p></div>`;return}
  if(!CUR){sum.innerHTML='';grid.className='';grid.innerHTML=`<div class="empty"><h2>建立第一個班級</h2><p>建立班級後輸入學生名字，就可以開始加減點。</p><button class="btn pri" id="goNew">建立班級</button></div>`;$('#goNew').onclick=()=>openManage('classes');renderBatch();return}
  const list=sortedStudents();
  if(!list.length){sum.innerHTML='';grid.className='';grid.innerHTML=`<div class="empty"><h2>${esc(CLASSES[CUR].name)} 還沒有學生</h2><p>到「班級與學生」新增學生名單。</p><button class="btn pri" id="goAdd">新增學生</button></div>`;$('#goAdd').onclick=()=>openManage('students');renderBatch();return}
  const ss=list.map(s=>stats(s));
  const wp=ss.reduce((a,x)=>a+x.wp,0),wn=ss.reduce((a,x)=>a+x.wn,0),avg=ss.reduce((a,x)=>a+x.tot,0)/ss.length;
  sum.innerHTML=`<div class="s"><span>學生</span><b>${list.length}</b></div><div class="s p"><span>本週加點</span><b>+${wp}</b></div><div class="s n adminonly"><span>本週扣點</span><b>${wn}</b></div><div class="s"><span>平均點數</span><b>${avg.toFixed(1)}</b></div>`;
  grid.className='grid'+(UI.batch?' batch':'');
  const order=classStudents().map(s=>s.id);
  grid.innerHTML=list.map((s,i)=>cardHTML(s,ss[i],order.indexOf(s.id)+1,SORT!=='seat'?i+1:0)).join('');
  UI.flash={};
  renderBatch();
}
function renderClassBar(){
  const a=activeClasses();
  const showT=!LOCAL&&IS_OWNER&&VIEW_ALL&&!UI.proj;
  $('#classBar').innerHTML=(!LOCAL&&IS_OWNER&&!UI.proj?`<button class="cchip add adminonly" id="viewToggle">${VIEW_ALL?'全部班級':'只看我的班'} ⇄</button>`:'')+a.map(c=>`<button class="cchip${c.id===CUR?' on':''}" data-c="${c.id}">${esc(c.name)}${showT?`<span class="ct">${esc(teacherNames(c))}</span>`:''}</button>`).join('')+(UI.proj?'':`<button class="cchip add adminonly" id="addClassChip">＋ 班級</button>`)+(a.length||UI.proj||IS_OWNER||LOCAL?'':'<span class="note">管理者還沒有把班級指派給你，也可以按「＋ 班級」自己建立。</span>');
  $('#classBar').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{CUR=b.dataset.c;lsSet('class',CUR);UI.sel.clear();if(LOCAL)render();else subscribeClass()});
  const ac=$('#addClassChip');if(ac)ac.onclick=()=>openManage('classes');
  const vt=$('#viewToggle');if(vt)vt.onclick=()=>{VIEW_ALL=!VIEW_ALL;lsSet('viewAll',VIEW_ALL?'1':'0');pickClass();subscribeClass();render()};
}
function cardHTML(s,st,seat,rank){
  const nm=s.nick||s.name;
  const rec=live(s).sort((a,b)=>b.t-a.t).slice(0,3);
  const fl=UI.flash[s.id];

function logHTML(list,limit){
  const rows=[];list.forEach(s=>(s.events||[]).forEach(e=>rows.push({s,e})));
  rows.sort((a,b)=>b.e.t-a.e.t);
  const show=rows.slice(0,limit||200);
  const ids=[...new Set(show.map(r=>r.e.by).concat(show.filter(r=>r.e.v).map(r=>r.e.v.by)).filter(x=>x&&x!=='me'))];
  if(USER&&ids.length)USER.profiles(ids).then(ps=>{let ch=false;for(const id of ids){const n=ps&&ps[id]&&ps[id].name;if(n&&PROFILES[id]!==n){PROFILES[id]=n;ch=true}}if(ch)document.querySelectorAll('[data-by]').forEach(el=>{const n=PROFILES[el.dataset.by];if(n)el.textContent=n})}).catch(()=>{});
  const who=id=>`<span data-by="${esc(id)}">${esc(PROFILES[id]||(id===ME?'我':'老師'))}</span>`;
  if(!show.length)return '<h3>異動紀錄</h3><p>還沒有紀錄。</p>';
  return `<h3>異動紀錄（最近 ${show.length} 筆）</h3><p class="note">紀錄不會被刪除。按「更正」會保留原紀錄並重新計算點數。</p><ul class="log">${show.map(({s,e})=>`<li class="${e.v?'void':''}"><span class="t">${fmtT(e.t)}</span>${list.length>1?`<b>${esc(s.nick||s.name)}</b>`:''}<span class="d ${e.d>0?'p':e.d<0?'n':''}">${e.d?sg(e.d):e.k==='feed'?'♥':'·'}</span><span class="what">${evDesc(e)}${e.l?` · 親密度 ${sg(e.l)}`:''}<br><span class="by">${who(e.by)}${e.v?` · 已更正（${esc(e.v.r)}，${fmtT(e.v.t)}，${who(e.v.by)}）`:''}</span></span>${e.v?'':`<button class="btn sm x" data-void="${s.id}|${e.id}">更正</button>`}</li>`).join('')}</ul>`;
}

   <div class="row" style="margin-bottom:8px"><button class="btn sm" id="jsAll">全選</button><button class="btn sm" id="jsNone">全不選</button><button class="btn sm" id="jsInv">反向選取</button><span class="note" id="jsCnt" style="margin-left:auto"></span></div>
   <div class="picks" id="jsList"></div>
   <h3>2. ${esc(book)} ${lesName(les)} · 選通過的項目</h3>
   <div class="jlbtns">${comps.map(k=>`<button class="ib coinb" data-jc="${k}|first"><b>+${JL_COMP[k][1]}</b>${JL_COMP[k][0]} 一次通過</button>`).join('')}${comps.map(k=>`<button class="ib coinr" data-jc="${k}|retake"><b>+1</b>${JL_COMP[k][0]} 補考通過</button>`).join('')}</div>
   ${comps.length===3?'<p class="note" style="margin-top:6px">單字、單元考、Sensay 三項都「一次通過」時，系統會自動多給 1 枚，這課剛好 10 枚。</p>':''}
   <h3>${esc(book)} 全班進度</h3>${prog}`,true);
  bindClose();draw();

  $('#jBook').onchange=()=>{keep();if(c.jlBook!==UIJ[CUR+'b']&&CAN){c.jlBook=UIJ[CUR+'b'];const {id:_,_new,...d}=c;saveDoc('ac_classes/'+CUR,d)}openJl()};
  $('#jLes').onchange=()=>{keep();openJl()};
  $('#jsAll').onclick=()=>{list.forEach(s=>JSEL.add(s.id));draw()};
  $('#jsNone').onclick=()=>{JSEL.clear();draw()};
  $('#jsInv').onclick=()=>{list.forEach(s=>JSEL.has(s.id)?JSEL.delete(s.id):JSEL.add(s.id));draw()};
  $('#sheet').querySelectorAll('[data-jc]').forEach(b=>b.onclick=()=>{
    if(!JSEL.size){toast('先點選學生',1);return}
    const [comp,kind]=b.dataset.jc.split('|');

    const d=kind==='first'?JL_COMP[comp][1]:1;
    const sids=[...JSEL];
    const skip=sids.filter(id=>{const x=((jlLedger(STUDENTS[id]).books[bk]||{les:{}}).les[les]||{});return !!x[comp]});
    const go=sids.filter(id=>!skip.includes(id));
    const nm=id=>STUDENTS[id].nick||STUDENTS[id].name;
    openModal(`<h2>確認發送傑立幣</h2><p>${esc(bk)} ${lesName(les)} · ${JL_COMP[comp][0]} ${kind==='first'?'一次通過':'補考通過'} <b style="color:#b77900">+${d} 枚</b></p>
     <h3>發給 ${go.length} 位</h3><p style="color:var(--ink)">${go.map(id=>esc(nm(id))).join('、')||'（沒有）'}</p>
     ${skip.length?`<h3>已經登記過，會略過</h3><p>${skip.map(id=>esc(nm(id))).join('、')}</p>`:''}
     <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="cNo">返回</button><button class="btn pri" id="cYes"${go.length?'':' disabled'}>確認發送</button></div>`);
    $('#cNo').onclick=()=>openJl();
    $('#cYes').onclick=()=>{if(!guard())return;let bonus=0,capped=0;
      go.forEach(id=>{const s=STUDENTS[id];const before=jlLedger(s);const bb=before.books[bk];
        addEvent(s,{k:'jl',book:bk,les,comp,kind,d,n:`${bk} ${lesName(les)} ${JL_COMP[comp][0]}${kind==='first'?'一次通過':'補考通過'}`});
        const after=jlLedger(s),ab=after.books[bk],x=ab.les[les];if(x._bonus&&!(bb&&bb.les[les]&&bb.les[les]._bonus))bonus++;if(ab.raw>JL_CAP&&(!bb||bb.raw<=JL_CAP||ab.raw>bb.raw))capped++;UI.flash[id]='p'});
      toast(`+${d} 傑立幣 · ${go.length} 人${bonus?`，${bonus} 人這課全部一次通過再 +1`:''}${capped?`，${capped} 人已達本冊上限 ${JL_CAP}`:''}`);
      render();JSEL.clear();openJl()};
  });
}

/* ---- school-wide overview (manager) ---- */
async function openOverview(range){
  range=range||'week';
  openModal(`<div class="shtop"><h2>全校總覽</h2>${closeBtn}</div><p>載入中…</p>`,true);bindClose();
  let studs=Object.values(STUDENTS);
  if(DB){try{const r=await DB.collection('ac_students').get();studs=r.docs.filter(d=>d.exists).map(d=>({...clone(d.data()),id:d.id}))}catch(e){toast('讀取失敗，請再試一次',1)}}
  const now=new Date(),day0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const from={today:day0,week:weekStart(),month:new Date(now.getFullYear(),now.getMonth(),1).getTime(),all:0}[range];
  const cls=Object.values(CLASSES).filter(c=>c.active!==false&&(LOCAL||IS_OWNER||canSee(c))).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0));
  const byT={},byI={};let tot={pos:0,neg:0,n:0};
  const rows=cls.map(c=>{
    const ss=studs.filter(x=>x.classId===c.id&&x.active!==false);
    let pos=0,neg=0,n=0,last=0,sumTot=0;
    ss.forEach(x=>{
      sumTot+=stats(x).tot;
      live(x).forEach(e=>{if(e.t<from)return;n++;const d=e.d||0;if(d>0)pos+=d;if(d<0)neg+=d;last=Math.max(last,e.t);
        const t=byT[e.by]||(byT[e.by]={n:0,pos:0,neg:0,last:0});t.n++;if(d>0)t.pos+=d;if(d<0)t.neg+=d;t.last=Math.max(t.last,e.t);
        const key=e.k==='adj'?'手動調整':e.n;const it=byI[key]||(byI[key]={n:0,d:0});it.n++;it.d+=d});
    });
    tot.pos+=pos;tot.neg+=neg;tot.n+=n;
    return {c,ss,pos,neg,n,last,avg:ss.length?sumTot/ss.length:0};
  });
  await loadNames(Object.keys(byT));
  const R_={today:'今天',week:'本週',month:'本月',all:'全部'};
  const maxI=Math.max(1,...Object.values(byI).map(x=>x.n));
  openModal(`<div class="shtop"><h2>全校總覽</h2>${closeBtn}</div>
   <div class="tabs">${Object.entries(R_).map(([k,t])=>`<button class="tab${range===k?' on':''}" data-r="${k}">${t}</button>`).join('')}</div>
   <div class="ovk"><div class="k"><span>班級</span><b>${cls.length}</b></div><div class="k"><span>學生</span><b>${rows.reduce((a,r)=>a+r.ss.length,0)}</b></div><div class="k p"><span>${R_[range]}加點</span><b>+${tot.pos}</b></div><div class="k n"><span>${R_[range]}扣點</span><b>${tot.neg}</b></div><div class="k"><span>${R_[range]}操作</span><b>${tot.n}</b></div></div>
   <h3>各班</h3><div class="scroll"><table class="tbl"><thead><tr><th>班級</th><th>負責老師</th><th>學生</th><th>加點</th><th>扣點</th><th>操作次數</th><th>平均點數</th><th>最近操作</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.c.name)}</b></td><td>${esc(teacherNames(r.c))}</td><td class="num">${r.ss.length}</td><td class="num pos">+${r.pos}</td><td class="num neg">${r.neg}</td><td class="num">${r.n}</td><td class="num">${r.avg.toFixed(1)}</td><td class="note">${r.last?fmtT(r.last):'—'}</td><td><button class="btn sm" data-go="${r.c.id}">開啟</button></td></tr>`).join('')}</tbody></table></div>
   <h3>項目統計（${R_[range]}）</h3>${Object.keys(byI).length?`<div class="scroll"><table class="tbl"><thead><tr><th>項目</th><th>次數</th><th>點數合計</th></tr></thead><tbody>${Object.entries(byI).sort((a,b)=>b[1].n-a[1].n).map(([k,x])=>`<tr><td>${esc(k)}</td><td class="num"><span class="ibar" style="width:${Math.round(x.n/maxI*120)}px;background:${x.d<0?'var(--minus)':x.d>0?'var(--plus)':'var(--muted)'}"></span>${x.n}</td><td class="num ${x.d>0?'pos':x.d<0?'neg':''}">${x.d?sg(x.d):'0'}</td></tr>`).join('')}</tbody></table></div>`:'<p>這段時間還沒有紀錄。</p>'}
   <h3>老師操作（${R_[range]}）</h3>${Object.keys(byT).length?`<div class="scroll"><table class="tbl"><thead><tr><th>老師</th><th>操作次數</th><th>加點</th><th>扣點</th><th>最近操作</th></tr></thead><tbody>${Object.entries(byT).sort((a,b)=>b[1].n-a[1].n).map(([id,t])=>`<tr><td>${esc(PROFILES[id]||(id===ME?'我':'老師'))}</td><td class="num">${t.n}</td><td class="num pos">+${t.pos}</td><td class="num neg">${t.neg}</td><td class="note">${fmtT(t.last)}</td></tr>`).join('')}</tbody></table></div>`:'<p>這段時間還沒有操作紀錄。</p>'}`,true);
  bindClose();
  $('#sheet').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openOverview(b.dataset.r));
  $('#sheet').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const id=b.dataset.go;if(!canSee(CLASSES[id])){VIEW_ALL=true;lsSet('viewAll','1')}CUR=id;lsSet('class',id);UI.sel.clear();closeModal();if(LOCAL)render();else subscribeClass()});
}

/* ---- rules (manager) ---- */
function openSettings(){
  if(!LOCAL&&!IS_OWNER){toast('規則設定只有管理者可以修改',1);return}
  const rowH=(it,k)=>`<tr><td><input type="text" data-in="${k}" value="${esc(it.n)}"></td><td><input type="number" data-ip="${k}" value="${it.p}" style="width:90px"></td><td><select data-ik="${k}"><option value="">一般</option><option value="hw_miss"${it.kind==='hw_miss'?' selected':''}>未交作業</option><option value="hw_late"${it.kind==='hw_late'?' selected':''}>補交（對應未交）</option></select></td><td><button class="btn sm warn" data-idel="${k}">刪除</button></td></tr>`;
  openModal(`<div class="shtop"><h2>規則設定</h2>${closeBtn}</div><p>所有老師、所有班級共用同一套加減點項目。</p>
   <h3>加減點項目</h3><div class="scroll"><table class="tbl"><thead><tr><th>項目名稱</th><th>點數</th><th>類型</th><th></th></tr></thead><tbody id="itRows">${CFG.items.map(rowH).join('')}</tbody></table></div>
   <div class="row" style="margin-top:8px"><button class="btn" id="itAdd">＋ 新增項目</button><span class="note">點數填 0 代表只記錄不加減點（例如考試未通過）。</span></div>
   <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn pri" id="itSave">儲存規則</button></div>
   <h3>匯出</h3><div class="row"><button class="btn" id="dCsv">下載點數表（CSV）</button><button class="btn" id="dJson">下載完整備份（JSON）</button></div>
   <textarea id="dText" placeholder="如果無法直接下載，內容會出現在這裡" style="margin-top:8px;min-height:60px"></textarea>`,true);
  bindClose();
  let items=clone(CFG.items);
  const read=()=>{items=items.map((it,k)=>({...it,n:$(`[data-in="${k}"]`).value.trim()||it.n,p:parseInt($(`[data-ip="${k}"]`).value,10)||0,kind:$(`[data-ik="${k}"]`).value||undefined}))};
  const draw=()=>{$('#itRows').innerHTML=items.map(rowH).join('');$('#itRows').querySelectorAll('[data-idel]').forEach(b=>armed(b,()=>{read();items.splice(+b.dataset.idel,1);draw()}))};
  draw();
  $('#itAdd').onclick=()=>{read();items.push({id:uid(),n:'新項目',p:1});draw()};
  $('#itSave').onclick=()=>{if(!guard())return;read();if(!items.length){toast('至少要有一個項目',1);return}CFG.items=items.map(x=>{const o={...x};if(!o.kind)delete o.kind;return o});saveDoc('ac_config/points',{items:CFG.items});render();toast('規則已儲存')};
  const dump=async()=>{let classes=CLASSES,students=STUDENTS;if(DB){try{const a=await DB.collection('ac_classes').get();classes={};a.docs.forEach(d=>classes[d.id]=d.data());const b=await DB.collection('ac_students').get();students={};b.docs.forEach(d=>students[d.id]=d.data())}catch(e){}}return{classes,students}};
  const save=async(name,text,type)=>{let dl=null;try{dl=await window.claude?.use?.('downloads')}catch(e){}if(dl){try{await dl.save({filename:name,data:new Blob([text],{type})});return}catch(e){}}if(FB){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();return}$('#dText').value=text;$('#dText').select();toast('已放在下方文字框，請全選複製')};
  $('#dCsv').onclick=async()=>{const d=await dump();const its=CFG.items;const rows=[['班級','姓名','暱稱','總點數','原有點數','本週加點','本週扣點',...its.map(i=>i.n+'（次）'),'手動調整（次）','傑立幣']];
    for(const s of Object.values(d.students)){if(s.active===false)continue;const st=stats(s),L=live(s);rows.push([(d.classes[s.classId]||{}).name||'',s.name,s.nick||'',st.tot,initPts(s),st.wp,st.wn,...its.map(i=>L.filter(e=>e.i===i.id).length),L.filter(e=>e.k==='adj').length,jlLedger(s).bal])}
    save(`班級加減點_${new Date().toISOString().slice(0,10)}.csv`,'﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv')};
  $('#dJson').onclick=async()=>{const d=await dump();save(`班級加減點備份_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({exported:new Date().toISOString(),...d,config:CFG},null,1),'application/json')};
}

/* ================= misc ================= */
function toast(msg,neg){const box=$('#toasts');const t=document.createElement('div');t.className='toast'+(neg?' neg':'');t.textContent=msg;box.appendChild(t);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>t.remove(),2600)}
let AC,SOUND=lsGet('sound')!=='0';
function tone(fs,dur=.09){if(!SOUND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*dur;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.08);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.1)})}catch(e){}}
$('#grid').addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;const id=card.dataset.id;if(UI.batch&&!UI.proj){UI.sel.has(id)?UI.sel.delete(id):UI.sel.add(id);render()}else openStudent(id)});
$('#bBatch').onclick=()=>openBatch();
$('#bJl').onclick=()=>openJl();
$('#bLog').onclick=()=>{if(CUR)openLog()};
$('#bManage').onclick=()=>openManage();
$('#bOv').onclick=()=>openOverview();
$('#bSet').onclick=()=>openSettings();
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{SORT=b.dataset.sort;lsSet('sort',SORT);render()});
$('#bProj').onclick=()=>{UI.proj=true;UI.batch=false;UI.sel.clear();try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(e){}render()};
$('#bProjExit').onclick=()=>{UI.proj=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}closeModal();render()};
render();init();
</script>
